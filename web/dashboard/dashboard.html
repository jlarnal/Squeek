<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Squeek Dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head><body>
<header>
<div class="brand"><span>&#x1F43E;</span><h1>Squeek</h1><span class="ver" id="uiVer"></span></div>
<div class="hdr-right">
<div class="conn" id="connDot" title="WebSocket"></div>
<button class="langBtn" id="langBtn"></button>
</div>
</header>

<main>
<!-- ===== MAP TAB ===== -->
<div class="tab active" id="tab-map">
<div id="mapViewport">
<canvas id="mapCanvas"></canvas>
<div id="mapNodes"></div>
<div id="scanOverlay">
<svg viewBox="0 0 85 85" xmlns="http://www.w3.org/2000/svg">
<circle cx="42.33" cy="42.33" r="34" fill="none" stroke="#949494" stroke-width="1.5" opacity=".3"/>
<circle cx="42.33" cy="42.33" r="24" fill="none" stroke="#949494" stroke-width="1.5" opacity=".3"/>
<circle cx="42.33" cy="42.33" r="14" fill="none" stroke="#949494" stroke-width="1.5" opacity=".3"/>
<defs><linearGradient id="sg" gradientTransform="rotate(60 42.33 42.33)">
<stop offset="0%" stop-color="#40ff29" stop-opacity="0"/>
<stop offset="50%" stop-color="#40ff29" stop-opacity=".35"/>
<stop offset="100%" stop-color="#40ff29" stop-opacity="0"/>
</linearGradient></defs>
<path id="scanSector" fill="url(#sg)" d="M 32.88 5.07 C 38.93 3.54 45.17 3.52 51.07 4.9 56.98 6.28 62.57 9.06 67.31 13.11 L 42.33 42.33 Z"/>
<circle cx="42.33" cy="42.33" r="3" fill="#e3e3e3"/>
</svg>
<span class="scan-label" id="scanLabel" data-i18n="buildMap">Build Map</span>
<button class="btn btn-sm" id="scanBtn" data-i18n="buildMap">Build Map</button>
</div>
<div class="map-controls">
<button id="mapReset" title="Reset view">&#x21bb;</button>
</div>
<div id="mapInfo"></div>
</div>
<div class="card" style="margin-top:10px">
<div class="row" style="justify-content:space-between;font-size:.85em">
<span id="mapPeerCount">0 <span data-i18n="peers">peers</span></span>
<span id="mapBattery">-- mV</span>
<span id="mapDim">--D</span>
</div>
</div>
</div>

<!-- ===== PLAY TAB ===== -->
<div class="tab" id="tab-play">
<div class="card">
<h3 data-i18n="mode">Mode</h3>
<div class="btn-grid cols-4" id="modeGrid">
<button class="btn btn-sm btn-outline" data-mode="0" data-i18n="modeOff">Off</button>
<button class="btn btn-sm btn-outline" data-mode="1" data-i18n="modeTravel">Travel</button>
<button class="btn btn-sm btn-outline" data-mode="2" data-i18n="modeRandom">Random</button>
<button class="btn btn-sm btn-outline" data-mode="3" data-i18n="modeSeq">Seq</button>
</div>
</div>
<div class="card" id="travelCard" style="display:none">
<h3 data-i18n="travel">Travel Order</h3>
<div class="btn-grid cols-3" id="travelGrid">
<button class="btn btn-sm btn-outline" data-travel="0" data-i18n="nearest">Nearest</button>
<button class="btn btn-sm btn-outline" data-travel="1" data-i18n="axis">Axis</button>
<button class="btn btn-sm btn-outline" data-travel="2" data-i18n="random">Random</button>
</div>
</div>
<div class="card">
<h3 data-i18n="tones">Tones</h3>
<div class="btn-grid cols-3" id="toneGrid"></div>
</div>
</div>

<!-- ===== SEQUENCES TAB ===== -->
<div class="tab" id="tab-seq">
<div class="card">
<h3 data-i18n="sequence">Sequence</h3>
<div id="seqList"></div>
<div class="seq-counter" id="seqCounter">0/32</div>
</div>
<div class="card">
<h3 data-i18n="addStep">Add Step</h3>
<div class="row" style="flex-wrap:wrap;gap:6px">
<div class="flex1" style="min-width:80px"><label data-i18n="node">Node</label><select id="seqNode"></select></div>
<div class="flex1" style="min-width:80px"><label data-i18n="tone">Tone</label><select id="seqTone"></select></div>
<div style="width:70px"><label data-i18n="delay">Delay ms</label><input type="number" id="seqDelay" value="500" min="0" max="10000" step="50"></div>
<button class="btn btn-sm" id="seqAdd" style="align-self:flex-end">+</button>
</div>
</div>
<div class="btn-grid cols-4" style="margin-top:8px">
<button class="btn btn-sm" id="seqPlay" data-i18n="start">Play</button>
<button class="btn btn-sm btn-outline" id="seqSave" data-i18n="save">Save</button>
<button class="btn btn-sm btn-outline" id="seqLoad" data-i18n="load">Load</button>
<button class="btn btn-sm btn-outline" id="seqClear" data-i18n="clear">Clear</button>
</div>
</div>

<!-- ===== CONFIG TAB ===== -->
<div class="tab" id="tab-config">
<div class="card">
<h3 data-i18n="settings">Settings</h3>
<div id="cfgList"></div>
<button class="btn btn-sm" id="cfgSave" style="width:100%;margin-top:10px" data-i18n="save">Save</button>
</div>
<div class="card">
<h3>System</h3>
<div id="sysInfo">
<div class="sys-row"><span class="lbl" data-i18n="wifi">WiFi</span><span id="sysWifi">--</span></div>
<div class="sys-row"><span class="lbl" data-i18n="storage">Storage</span><span id="sysStorage">--</span></div>
<div class="sys-row"><span class="lbl" data-i18n="uptime">Uptime</span><span id="sysUptime">--</span></div>
<div class="sys-row"><span class="lbl" data-i18n="version">Version</span><span id="sysBuild">--</span></div>
<div class="sys-row"><span class="lbl">Heap</span><span id="sysHeap">--</span></div>
</div>
<div class="bar-track" style="margin-top:8px"><div class="bar-fill" id="storageBar" style="width:0%"></div></div>
</div>
<div style="margin-top:10px">
<button class="btn btn-danger" id="btnReboot" style="width:100%" data-i18n="reboot">Reboot</button>
</div>
</div>
</main>

<nav id="tabs">
<button class="active" data-tab="tab-map">
<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
<span data-i18n="tabMap">Map</span>
</button>
<button data-tab="tab-play">
<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
<span data-i18n="tabPlay">Play</span>
</button>
<button data-tab="tab-seq">
<svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
<span data-i18n="tabSeq">Seq</span>
</button>
<button data-tab="tab-config">
<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
<span data-i18n="tabConfig">Config</span>
</button>
</nav>

<div id="toast"></div>
<script src="/dashboard.js"></script>
</body></html>
